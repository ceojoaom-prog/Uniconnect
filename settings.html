<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniConnect | Definições</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="settings">
    <div class="app-shell">
      <header class="topbar fixed-header">
        <div class="container nav-shell nav-shell-app">
          <div class="brand-wrap">
            <div class="brand-mark">U</div>
            <div>
              <div class="brand-name">UniConnect</div>
            </div>
          </div>

          <div class="search-box">
            <span>🔎</span>
            <input type="text" placeholder="Configurações" />
          </div>

          <div class="topbar-actions">
            <a href="feed.html" class="icon-btn" aria-label="Feed">🏠</a>
            <a href="profile.html" class="user-pill">
              <span class="avatar avatar-sm">A</span>
              <span id="headerUserName">Aluno</span>
            </a>
          </div>
        </div>
      </header>

      <div class="app-layout container page-layout">
        <aside class="sidebar left-sidebar">
          <nav class="side-nav">
            <a href="feed.html">🏠 Início</a>
            <a href="explore.html">🔍 Explorar</a>
            <a href="questions.html">❓ Perguntas</a>
            <a href="videos.html">🎥 Vídeos</a>
            <a href="groups.html">👥 Grupos</a>
            <a href="messages.html">💬 Mensagens</a>
            <a href="profile.html">👤 Meu perfil</a>
            <a class="active" href="settings.html">⚙️ Definições</a>
          </nav>
        </aside>

        <main class="content-column">
          <section class="card settings-card">
            <h2>Definições da conta</h2>
            <form class="settings-form">
              <div class="field-group">
                <label>Nome</label>
                <input type="text" value="Ana da Silva" />
              </div>
              <div class="field-group">
                <label>Email</label>
                <input type="email" value="ana@uem.mz" />
              </div>
              <div class="field-group">
                <label>Província</label>
                <input type="text" value="Maputo" />
              </div>
              <div class="field-group">
                <label>Biografia</label>
                <textarea rows="4">Estudante de Engenharia de Software, apaixonada por tecnologia e aprendizagem colaborativa.</textarea>
              </div>
              <button type="button" class="btn btn-primary">Guardar alterações</button>
              <button type="button" class="btn btn-secondary" id="logoutBtn">Sair da conta</button>
            </form>
          </section>
        </main>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
