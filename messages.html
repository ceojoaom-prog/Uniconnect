<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniConnect | Mensagens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="messages">
    <div class="app-shell">
      <header class="topbar fixed-header">
        <div class="container nav-shell nav-shell-app">
          <div class="brand-wrap">
            <div class="brand-mark">U</div>
            <div>
              <div class="brand-name">UniConnect</div>
            </div>
          </div>

          <div class="search-box">
            <span>🔎</span>
            <input type="text" placeholder="Pesquisar contactos" />
          </div>

          <div class="topbar-actions">
            <a href="feed.html" class="icon-btn" aria-label="Feed">🏠</a>
            <a href="profile.html" class="user-pill">
              <span class="avatar avatar-sm">A</span>
              <span id="headerUserName">Aluno</span>
            </a>
          </div>
        </div>
      </header>

      <div class="app-layout container messages-layout">
        <aside class="sidebar left-sidebar">
          <nav class="side-nav">
            <a href="feed.html">🏠 Início</a>
            <a href="explore.html">🔍 Explorar</a>
            <a href="questions.html">❓ Perguntas</a>
            <a href="videos.html">🎥 Vídeos</a>
            <a href="groups.html">👥 Grupos</a>
            <a class="active" href="messages.html">💬 Mensagens</a>
            <a href="profile.html">👤 Meu perfil</a>
            <a href="settings.html">⚙️ Definições</a>
          </nav>
        </aside>

        <main class="content-column chat-panel">
          <div class="chat-window card">
            <div class="chat-header">
              <div class="chat-user">
                <div class="avatar avatar-md">S</div>
                <div>
                  <h4>Samuel Chale</h4>
                  <small>Online agora</small>
                </div>
              </div>
            </div>

            <div id="messagesList" class="messages-list"></div>

            <form id="messageForm" class="chat-form">
              <input id="messageInput" type="text" placeholder="Escreve uma mensagem..." required />
              <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
          </div>
        </main>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
